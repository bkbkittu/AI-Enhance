<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Free AI Photo Enhancer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #4f46e5, #9333ea);
      min-height: 100vh;
      padding: 20px;
      color: #111827;
    }

    .app {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      color: white;
      text-align: center;
      margin: 15px 0 8px;
      font-size: 30px;
    }

    .subtitle {
      color: white;
      text-align: center;
      margin-bottom: 22px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,.22);
    }

    .upload {
      display: block;
      text-align: center;
      padding: 28px 10px;
      border: 2px dashed #6366f1;
      border-radius: 18px;
      background: #f5f3ff;
      cursor: pointer;
    }

    .upload-icon {
      font-size: 45px;
    }

    .upload-title {
      font-size: 19px;
      font-weight: bold;
      margin-top: 8px;
    }

    .upload-info {
      color: #6b7280;
      margin-top: 5px;
      font-size: 13px;
    }

    #photo {
      display: none;
    }

    .preview {
      display: none;
      margin-top: 18px;
    }

    .preview img,
    .result img {
      width: 100%;
      max-height: 450px;
      object-fit: contain;
      border-radius: 15px;
      background: #eee;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 15px;
      margin-top: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .enhance {
      background: #4f46e5;
      color: white;
    }

    .enhance:disabled {
      background: #aaa;
    }

    .download {
      display: none;
      background: #16a34a;
      color: white;
    }

    .status {
      text-align: center;
      margin: 17px 0 5px;
      color: #4b5563;
      min-height: 22px;
    }

    .progress {
      height: 8px;
      background: #e5e7eb;
      border-radius: 20px;
      overflow: hidden;
      display: none;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: #4f46e5;
      transition: width .2s;
    }

    .result {
      display: none;
      margin-top: 22px;
    }

    .result h2 {
      font-size: 20px;
    }

    .note {
      text-align: center;
      color: #6b7280;
      font-size: 12px;
      margin-top: 18px;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>✨ Free AI Photo Enhancer</h1>

  <div class="subtitle">
    Real ESRGAN AI • No API Key • No Upload
  </div>

  <div class="card">

    <label class="upload" for="photo">

      <div class="upload-icon">📷</div>

      <div class="upload-title">
        Select Photo
      </div>

      <div class="upload-info">
        JPG, PNG or WEBP
      </div>

    </label>

    <input
      id="photo"
      type="file"
      accept="image/jpeg,image/png,image/webp"
    >

    <div class="preview" id="preview">
      <h3>Original Photo</h3>
      <img id="original">
    </div>

    <button
      class="btn enhance"
      id="enhanceBtn"
      disabled
    >
      🤖 AI Enhance 2×
    </button>

    <div class="status" id="status">
      Select a photo to start
    </div>

    <div class="progress" id="progress">
      <div class="bar" id="bar"></div>
    </div>

    <div class="result" id="result">

      <h2>✨ AI Enhanced Photo</h2>

      <img id="output">

      <button
        class="btn download"
        id="downloadBtn"
      >
        📥 Download HD Photo
      </button>

    </div>

    <div class="note">
      AI processing happens in your browser.
      Your photo is not uploaded to a server.
    </div>

  </div>

</div>


<!-- TensorFlow.js -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

<!-- ESRGAN AI Model -->
<script src="https://cdn.jsdelivr.net/npm/@upscalerjs/default-model@latest/dist/umd/index.min.js"></script>

<!-- UpscalerJS -->
<script src="https://cdn.jsdelivr.net/npm/upscaler@latest/dist/browser/umd/upscaler.min.js"></script>


<script>

  const photoInput =
    document.getElementById("photo");

  const original =
    document.getElementById("original");

  const preview =
    document.getElementById("preview");

  const enhanceBtn =
    document.getElementById("enhanceBtn");

  const status =
    document.getElementById("status");

  const progress =
    document.getElementById("progress");

  const bar =
    document.getElementById("bar");

  const result =
    document.getElementById("result");

  const output =
    document.getElementById("output");

  const downloadBtn =
    document.getElementById("downloadBtn");


  let selectedImage = null;
  let outputData = null;
  let upscaler = null;


  /*
   * Create the real ESRGAN upscaler
   */

  async function createAI() {

    status.innerText =
      "⏳ Loading AI model...";

    try {

      upscaler = new Upscaler({
        model: DefaultUpscalerJSModel
      });

      status.innerText =
        "✅ AI model ready";

    } catch (error) {

      console.error(error);

      status.innerText =
        "❌ AI model could not load";

    }

  }


  /*
   * Select photo
   */

  photoInput.addEventListener(
    "change",
    function () {

      const file = this.files[0];

      if (!file) return;

      selectedImage =
        URL.createObjectURL(file);

      original.src =
        selectedImage;

      preview.style.display =
        "block";

      enhanceBtn.disabled =
        false;

      result.style.display =
        "none";

      downloadBtn.style.display =
        "none";

      status.innerText =
        "✅ Photo selected";

    }
  );


  /*
   * AI Enhance
   */

  enhanceBtn.addEventListener(
    "click",
    async function () {

      if (!selectedImage) {
        status.innerText =
          "❌ Select a photo first";
        return;
      }

      if (!upscaler) {

        status.innerText =
          "⏳ AI model is loading...";

        await createAI();

      }

      enhanceBtn.disabled =
        true;

      progress.style.display =
        "block";

      bar.style.width =
        "5%";

      status.innerText =
        "🤖 AI enhancement started...";


      try {

        /*
         * Real neural-network ESRGAN
         */

        outputData =
          await upscaler.upscale(
            selectedImage,
            {
              patchSize: 64,

              padding: 2,

              progress: function (progress) {

                const percent =
                  Math.round(progress * 100);

                bar.style.width =
                  percent + "%";

                status.innerText =
                  "🤖 AI processing " +
                  percent +
                  "%";

              }

            }
          );


        output.src =
          outputData;

        result.style.display =
          "block";

        downloadBtn.style.display =
          "block";

        bar.style.width =
          "100%";

        status.innerText =
          "✅ AI enhancement complete!";


      } catch (error) {

        console.error(error);

        status.innerText =
          "❌ AI processing failed. Try a smaller photo.";

      }


      enhanceBtn.disabled =
        false;

    }
  );


  /*
   * Download
   */

  downloadBtn.addEventListener(
    "click",
    function () {

      if (!outputData) return;

      const link =
        document.createElement("a");

      link.href =
        outputData;

      link.download =
        "AI-Enhanced-Photo.png";

      document.body.appendChild(link);

      link.click();

      document.body.removeChild(link);

    }
  );


  /*
   * Load AI when page opens
   */

  window.addEventListener(
    "load",
    function () {

      setTimeout(
        createAI,
        500
      );

    }
  );

</script>

</body>
</html>
