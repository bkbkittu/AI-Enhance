<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free AI Enhancer</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #4f46e5;
      color: white;
      padding: 25px;
    }

    .box {
      background: white;
      color: #222;
      padding: 20px;
      border-radius: 20px;
      max-width: 500px;
      margin: auto;
    }

    img {
      max-width: 100%;
      margin-top: 15px;
      border-radius: 12px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: 0;
      border-radius: 12px;
      background: #4f46e5;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    button:disabled {
      background: #aaa;
    }

    #status {
      margin-top: 15px;
      color: #555;
    }
  </style>
</head>

<body>

<h1>✨ Free AI Photo Enhancer</h1>

<div class="box">

  <input
    type="file"
    id="photo"
    accept="image/*"
  >

  <img id="preview" style="display:none;">

  <button id="enhance" disabled>
    🤖 AI Enhance 2×
  </button>

  <div id="status">
    Loading AI...
  </div>

  <img id="result" style="display:none;">

  <button id="download" style="display:none;">
    📥 Download
  </button>

</div>


<!-- 1. TensorFlow.js -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

<!-- 2. ESRGAN model -->
<script src="https://cdn.jsdelivr.net/npm/@upscalerjs/default-model@latest/dist/umd/index.min.js"></script>

<!-- 3. UpscalerJS -->
<script src="https://cdn.jsdelivr.net/npm/upscaler@latest/dist/browser/umd/upscaler.min.js"></script>


<script>

let upscaler;
let selectedImage;
let resultData;


const status =
  document.getElementById("status");

const enhance =
  document.getElementById("enhance");

const photo =
  document.getElementById("photo");

const preview =
  document.getElementById("preview");

const result =
  document.getElementById("result");

const download =
  document.getElementById("download");


async function startAI() {

  try {

    status.innerText =
      "⏳ Loading AI model...";

    await tf.ready();

    upscaler = new Upscaler({
      model: DefaultUpscalerJSModel
    });

    status.innerText =
      "✅ AI ready — photo select करें";

  }

  catch(error) {

    console.error(error);

    status.innerText =
      "❌ AI model load नहीं हुआ";

  }

}


photo.addEventListener(
  "change",
  function() {

    const file =
      this.files[0];

    if (!file) return;

    selectedImage =
      URL.createObjectURL(file);

    preview.src =
      selectedImage;

    preview.style.display =
      "block";

    enhance.disabled =
      false;

    status.innerText =
      "✅ Photo selected";

  }
);


enhance.addEventListener(
  "click",
  async function() {

    if (!upscaler) {

      status.innerText =
        "⏳ AI अभी loading है";

      return;

    }

    enhance.disabled =
      true;

    status.innerText =
      "🤖 AI enhancement शुरू...";

    try {

      resultData =
        await upscaler.upscale(
          selectedImage,
          {
            patchSize: 64,
            padding: 2,

            progress: function(p) {

              status.innerText =
                "🤖 AI processing " +
                Math.round(p * 100) +
                "%";

            }

          }
        );

      result.src =
        resultData;

      result.style.display =
        "block";

      download.style.display =
        "block";

      status.innerText =
        "✅ AI Enhancement Complete!";

    }

    catch(error) {

      console.error(error);

      status.innerText =
        "❌ Enhancement failed";

    }

    enhance.disabled =
      false;

  }
);


download.addEventListener(
  "click",
  function() {

    const a =
      document.createElement("a");

    a.href =
      resultData;

    a.download =
      "AI-Enhanced.png";

    a.click();

  }
);


startAI();

</script>

</body>
</html>
