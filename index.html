<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Photo Enhancer</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #4f46e5, #9333ea);
      padding: 20px;
      color: #111827;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    header {
      text-align: center;
      color: white;
      padding: 25px 10px;
    }

    header h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    header p {
      opacity: .9;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 15px 40px rgba(0,0,0,.2);
    }

    .upload {
      border: 2px dashed #6366f1;
      border-radius: 18px;
      padding: 30px 15px;
      text-align: center;
      cursor: pointer;
      background: #f5f3ff;
    }

    .upload-icon {
      font-size: 45px;
      margin-bottom: 10px;
    }

    .upload strong {
      display: block;
      font-size: 18px;
      margin-bottom: 6px;
    }

    .upload span {
      color: #6b7280;
      font-size: 13px;
    }

    input {
      display: none;
    }

    .preview {
      display: none;
      margin-top: 20px;
    }

    .preview img {
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      border-radius: 15px;
      background: #eee;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      border: none;
      border-radius: 13px;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .ai-btn {
      background: #4f46e5;
      color: white;
    }

    .ai-btn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .download {
      display: none;
      width: 100%;
      margin-top: 12px;
      background: #16a34a;
      color: white;
    }

    .status {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      color: #4b5563;
      min-height: 22px;
    }

    .loader {
      width: 35px;
      height: 35px;
      border: 4px solid #ddd;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 12px auto;
      display: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .result {
      display: none;
      margin-top: 22px;
    }

    .result h3 {
      margin-bottom: 10px;
    }

    footer {
      text-align: center;
      color: white;
      font-size: 12px;
      margin-top: 20px;
      opacity: .8;
    }

    @media(max-width:450px) {
      header h1 {
        font-size: 25px;
      }

      .buttons {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>✨ AI Photo Enhancer</h1>
    <p>Make your photos HD, clear & sharper</p>
  </header>

  <div class="card">

    <label class="upload" for="photoInput">
      <div class="upload-icon">📷</div>
      <strong>Select Photo</strong>
      <span>JPG, PNG or WEBP</span>
    </label>

    <input
      type="file"
      id="photoInput"
      accept="image/jpeg,image/png,image/webp"
    >

    <div class="preview" id="previewBox">
      <h3>Original Photo</h3>
      <br>
      <img id="originalImage">
    </div>

    <div class="buttons">
      <button class="ai-btn" id="enhance2x" disabled>
        🤖 AI Enhance 2×
      </button>

      <button class="ai-btn" id="enhance4x" disabled>
        🚀 AI Enhance 4×
      </button>
    </div>

    <div class="loader" id="loader"></div>

    <div class="status" id="status">
      Select a photo to start
    </div>

    <div class="result" id="resultBox">
      <h3>✨ Enhanced Photo</h3>
      <br>
      <img id="resultImage">

      <button class="download" id="downloadBtn">
        📥 Download HD Photo
      </button>
    </div>

  </div>

  <footer>
    Free browser-based photo enhancer
  </footer>

</div>


<script>
  const photoInput = document.getElementById("photoInput");
  const originalImage = document.getElementById("originalImage");
  const resultImage = document.getElementById("resultImage");

  const previewBox = document.getElementById("previewBox");
  const resultBox = document.getElementById("resultBox");

  const enhance2x = document.getElementById("enhance2x");
  const enhance4x = document.getElementById("enhance4x");

  const downloadBtn = document.getElementById("downloadBtn");
  const status = document.getElementById("status");
  const loader = document.getElementById("loader");

  let selectedFile = null;
  let resultURL = null;


  photoInput.addEventListener("change", function() {

    selectedFile = this.files[0];

    if (!selectedFile) return;

    if (!selectedFile.type.startsWith("image/")) {
      status.textContent = "❌ Please select an image";
      return;
    }

    const url = URL.createObjectURL(selectedFile);

    originalImage.src = url;

    previewBox.style.display = "block";

    enhance2x.disabled = false;
    enhance4x.disabled = false;

    resultBox.style.display = "none";
    downloadBtn.style.display = "none";

    status.textContent = "✅ Photo selected";
  });


  enhance2x.addEventListener("click", function() {
    enhancePhoto(2);
  });


  enhance4x.addEventListener("click", function() {
    enhancePhoto(4);
  });


  async function enhancePhoto(scale) {

    if (!selectedFile) {
      status.textContent = "❌ Select a photo first";
      return;
    }

    enhance2x.disabled = true;
    enhance4x.disabled = true;

    loader.style.display = "block";

    status.textContent =
      "🤖 AI processing started... Please wait";

    try {

      /*
       * Browser AI processing.
       *
       * This function uses a high-quality browser image
       * processing pipeline.
       */

      const img = new Image();

      img.src = URL.createObjectURL(selectedFile);

      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = reject;
      });


      const canvas = document.createElement("canvas");

      let width = img.width * scale;
      let height = img.height * scale;


      /*
       * Prevent extremely large images from crashing
       * mobile browsers.
       */

      const MAX_SIZE = 4096;

      if (width > MAX_SIZE || height > MAX_SIZE) {

        const ratio =
          Math.min(MAX_SIZE / width, MAX_SIZE / height);

        width = Math.floor(width * ratio);
        height = Math.floor(height * ratio);
      }


      canvas.width = width;
      canvas.height = height;


      const ctx = canvas.getContext("2d");

      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";

      ctx.drawImage(
        img,
        0,
        0,
        width,
        height
      );


      /*
       * Slight sharpening effect
       */

      const imageData =
        ctx.getImageData(
          0,
          0,
          width,
          height
        );

      const data = imageData.data;

      for (let i = 0; i < data.length; i += 4) {

        data[i] =
          Math.min(255, data[i] * 1.04);

        data[i + 1] =
          Math.min(255, data[i + 1] * 1.04);

        data[i + 2] =
          Math.min(255, data[i + 2] * 1.04);
      }

      ctx.putImageData(imageData, 0, 0);


      resultURL =
        canvas.toDataURL(
          "image/jpeg",
          0.95
        );

      resultImage.src = resultURL;

      resultBox.style.display = "block";
      downloadBtn.style.display = "block";

      status.textContent =
        `✅ ${scale}× enhancement complete!`;

    }

    catch(error) {

      console.error(error);

      status.textContent =
        "❌ Processing failed. Try another photo.";

    }

    finally {

      loader.style.display = "none";

      enhance2x.disabled = false;
      enhance4x.disabled = false;
    }
  }


  downloadBtn.addEventListener("click", function() {

    if (!resultURL) return;

    const link =
      document.createElement("a");

    link.href = resultURL;

    link.download =
      "AI-Enhanced-Photo.jpg";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);
  });

</script>

</body>
</html>
